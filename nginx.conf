server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # index.html is ~1 MB, mostly base64-inlined React, Leaflet and fonts.
    # That payload is already dense, so gzip only trims it modestly.
    gzip              on;
    # text/html is always gzipped by nginx; listing it again is a warning.
    gzip_types        text/css application/javascript image/svg+xml;
    gzip_min_length   1024;
    gzip_comp_level   6;

    # NOTE: nginx's add_header does NOT merge across levels — a location block
    # with its own add_header drops every header inherited from `server`. So the
    # security headers are repeated in each location that sets Cache-Control.
    # Keep them in sync when editing.
    #
    # The page inlines its own scripts and styles and talks to OSM at runtime:
    # connect-src covers Nominatim search, img-src covers map tiles plus the
    # data: URIs behind the duotone place art and the favicon, and blob: covers
    # the bundle's own unpacking of React/Leaflet.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' blob: https://nominatim.openstreetmap.org; frame-src blob:; base-uri 'self'; form-action 'none'";

    # The invite and reply live in the URL fragment, which never reaches this
    # server, so there is nothing user-specific to cache wrongly. HTML and the
    # branding file stay uncached so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /brand.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Everything is one page; unknown paths fall back to it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    access_log off;
}
